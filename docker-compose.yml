services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./savanna:/usr/share/nginx/html/savanna:ro
      - ./module:/usr/share/nginx/html/module:ro
      - ./demo:/usr/share/nginx/html/demo:ro
      - ./savanna/pages/concept-with-navigation.html:/usr/share/nginx/html/index.html:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8081:8000"
    env_file:
      - .env
    environment:
      ESCALATIONS_DB: /data/escalations.sqlite3
    volumes:
      - ./demo:/app/demo:ro
      - ./module:/app/module:ro
      - ./savanna:/app/savanna:ro
      - api-data:/data
    restart: unless-stopped

  telegram:
    build: ./api
    command: ["python", "-m", "api.telegram_bot"]
    env_file:
      - .env
    environment:
      ESCALATIONS_DB: /data/escalations.sqlite3
    volumes:
      - api-data:/data
    restart: unless-stopped
    profiles:
      - telegram

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

volumes:
  api-data:
  ollama-data:
