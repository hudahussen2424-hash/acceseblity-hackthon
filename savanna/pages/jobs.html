  <main class="lesson-body">
    <h1 class="lesson-title">Career gateway: test jobs</h1>
    <p>These eight fictional TEST listings are practice examples only. They are not real vacancies, employers, or people.</p>
    <p id="job-status" role="status" aria-live="polite">Loading test jobs…</p>
    <section id="jobs" aria-label="Test job listings"></section>
  </main>
  <script>
    (async () => {
      const list = document.getElementById("jobs");
      const status = document.getElementById("job-status");
      try {
        const response = await fetch("../../demo/data/jobs.json");
        if (!response.ok) throw new Error("Jobs could not be loaded.");
        const jobs = await response.json();
        for (const job of jobs) {
          const article = document.createElement("article"); article.className = "job-card"; article.id = job.id;
          const title = document.createElement("h2"); title.textContent = job.title; article.append(title);
          const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "TEST listing"; article.append(badge);
          const details = document.createElement("p"); details.textContent = `${job.employer} · ${job.location} · ${job.remote ? "Remote" : "On site"}`; article.append(details);
          const description = document.createElement("p"); description.textContent = job.description; article.append(description);
          const accommodationsTitle = document.createElement("h3"); accommodationsTitle.textContent = "Available interview and work accommodations"; article.append(accommodationsTitle);
          const accommodations = document.createElement("ul");
          for (const item of job.accommodations) { const li = document.createElement("li"); li.textContent = item; accommodations.append(li); }
          article.append(accommodations);
          const link = document.createElement("a"); link.href = job.url; link.textContent = "View this test listing"; article.append(link);
          list.append(article);
        }
        status.textContent = `${jobs.length} TEST jobs loaded.`;
      } catch (error) { status.textContent = error.message; }
    })();
  </script>
